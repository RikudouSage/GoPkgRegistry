<section class="login-layout">
  <div class="login-intro">
    <p class="eyebrow">{{ 'login.eyebrow' | transloco }}</p>
    <h1>{{ 'login.administration' | transloco }}</h1>
    <p class="intro-copy">{{ 'login.introduction' | transloco }}</p>
  </div>

  <form class="login-card" (ngSubmit)="onSubmit()">
    <div class="card-heading">
      <h2>{{'login.title' | transloco}}</h2>
      <p>{{ 'login.continue' | transloco }}</p>
    </div>
    <label for="api-key">{{'login.api_key' | transloco}}</label>
    <input id="api-key" type="password" autocomplete="current-password" [placeholder]="'login.api_key_placeholder' | transloco" [formField]="form.apiKey" />
    <button [disabled]="!form().valid()" type="submit">{{'login.submit' | transloco}} <span aria-hidden="true">→</span></button>
  </form>
</section>
