name: Publish docker

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rikudousage/go-pkg-repository
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=dev,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}

      - name: Build Docker image
        env:
          PACKAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if [[ "$PACKAGE_VERSION" == "dev" ]]; then
            nix build .#docker
          else
            nix build --impure .#docker
          fi

          docker load < result

      - name: Push Docker images
        env:
          SOURCE_TAG: ${{ steps.meta.outputs.version }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r image_tag; do
            [[ -n "$image_tag" ]] || continue
            docker tag "go-pkg-repository:$SOURCE_TAG" "$image_tag"
            docker push "$image_tag"
          done <<< "$IMAGE_TAGS"
